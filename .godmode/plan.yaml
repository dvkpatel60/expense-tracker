# Pattern: Pipeline
# Phase 1 (data integrity) -> Phase 2 (polish existing) -> Phase 3 (AI enhancement) -> Phase 4 (data management)
# Max parallelism: 3 tasks per round within a phase

# ──────────────────────────────────────────────────────────────────────
# Phase 1: Data Integrity Fixes (BLOCKING — no other work proceeds until green)
# ──────────────────────────────────────────────────────────────────────

- id: "task-01"
  title: "Investigate and fix provider-as-merchant data corruption"
  skill: "fix"
  files:
    - src/enrich/facts.ts
    - src/core/normalize.ts
    - tests/enrich.test.ts
  depends_on: []
  agent: true
  test: "npx vitest run tests/enrich.test.ts"
  done_when: "npx vitest run tests/enrich.test.ts | grep -q 'Tests.*passed'"
  notes: |
    The enrichment prompt asks the model to identify merchants from normalized
    strings. If the model returns provider names (Anthropic, Gemini) as merchant
    names, those pollute the cache and display. Fix requires:
    1. Add RESERVED_MERCHANTS set in facts.ts with provider/model names
    2. Filter in collect() — skip facts whose name matches a reserved entry
    3. Add regression test: parseFacts with "Anthropic" in response -> filtered
    4. Also filter in enricher.ts redactForLookup for safety

- id: "task-02"
  title: "Add provider-name blocklist to enrichment prompt"
  skill: "fix"
  files:
    - src/enrich/prompt.ts
    - tests/enrich.test.ts
  depends_on: ["task-01"]
  agent: true
  test: "npx vitest run tests/enrich.test.ts"
  done_when: "npx vitest run tests/enrich.test.ts | grep -q 'Tests.*passed'"
  notes: |
    Strengthen the prompt itself to tell the model not to return provider/platform
    names as merchant names. Add: "Never return provider names (Anthropic, Gemini,
    Google, OpenAI, etc.) as merchant names — these are the AI services, not
    merchants." This is belt-and-suspenders with task-01's filter.

