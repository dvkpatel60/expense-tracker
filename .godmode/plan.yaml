- id: "task-07"
  title: "Add recurring transaction detection (pure core computation)"
  skill: "build"
  files:
    - src/core/ledger.ts
    - src/core/recurring.ts
    - tests/ledger.test.ts
  depends_on: ["task-01"]
  agent: true
  test: "npx vitest run tests/ledger.test.ts"
  done_when: "npx vitest run tests/ledger.test.ts | grep -q 'Tests.*passed'"
  notes: |
    Recurring detection is pure computation, no AI needed. Steps:
    1. Create src/core/recurring.ts with detectRecurring(state, period)
       - Group transactions by merchantKey
       - For each merchant with 3+ transactions:
         - Calculate median interval between transactions
         - Flag if interval is 28-35 days (monthly) or 6-8 days (weekly)
         - Return: { merchantKey, merchantName, avgAmount, frequency, nextExpected }
    2. Add to LedgerState or compute on-the-fly (compute is fine, not cached)
    3. Surface in Overview.tsx attention items section
    4. Surface in Activity.tsx as a "Recurring" filter/chip
    5. Tests: detectRecurring with known patterns, edge cases (irregular intervals)

