- id: "task-12"
  title: "Extract a shared BudgetTotals/grouped-spend computation used by donut, list and lens"
  skill: "refactor"
  files:
    - src/core/ledger.ts
    - src/ui/components/CategoryDonut.tsx
    - src/ui/components/CategoryLens.tsx
    - src/ui/views/Overview.tsx
    - tests/ledger.test.ts
  depends_on: ["task-03"]
  agent: true
  test: "npx vitest run tests/ledger.test.ts && npx vitest run tests/app.test.tsx"
  done_when: "npx vitest run tests/ledger.test.ts && npx vitest run tests/app.test.tsx | grep -q 'Tests.*passed'"
  notes: |
    Today the donut computes its slices from GroupTotal/CategoryTotal, the ranked
    category list re-totals independently, and the lens re-derives transactions.
    Add one pure helper in core (e.g. buildSpendTree(state, period)) that returns
    a nested tree: group -> category -> {yourShare, cashOut, count, merchantTotals},
    so donut, ranked list, and lens all read the same derived value. This removes
    the risk that the ring and the list drift (a real failure mode the app guards
    against elsewhere via derived-only groupTotals). No behavioural change — pure
    refactor; the tests pin the existing numbers.

- id: "task-13"
  title: "Overhaul CategoryDonut with macro->micro nesting and smooth transitions"
  skill: "build"
  files:
    - src/ui/components/CategoryDonut.tsx
    - src/ui/tokens.css
    - src/ui/views/Overview.tsx
    - tests/app.test.tsx
  depends_on: ["task-12"]
  agent: true
  test: "npx vitest run tests/app.test.tsx"
  done_when: "npx vitest run tests/app.test.tsx | grep -q 'Tests.*passed'"
  notes: |
    Problem from audit: the ring shows only 6 groups; micro-categories are only
    reachable by a drill-in that many users never discover, and a 6-slice ring
    with a ranked list beside it is two ways of showing the same top level.
    Redesign:
    1. Keep the ring at group level, but add an animated drill: clicking a group
       (or its key row) smooths the arcs from group angles to that group's
       category angles (d3-shape arc with interpolated corners or a transition
       on the same layout function). The centre total becomes the drilled
       group's total, and the back <button> returns.
    2. Add a nested treemap/sunburst alternative toggle ("Ring | Treemap") that
       shows all 21 categories as nested rectangles inside their group's colour
       family (shades of the same hue — the existing --cat-* vs --grp-* token
       scheme does exactly this). This is the fix for the micro-categories-
       unreadable-at-a-glance complaint.
    3. Hover a slice -> highlight + the CategoryLens for that category/group.
    4. Keep aria-hidden on the SVG; the ranked list remains the accessible text.
    Verify with the screenshot script that a drilled ring and the treemap render
    without clipping (the lens/scrim pointer-interception bugs also get fixed here
    by making the lens non-blocking for hover, see task-14).

- id: "task-14"
  title: "Upgrade CategoryLens: sticky, larger, context-aware, keyboard-accessible"
  skill: "build"
  files:
    - src/ui/components/CategoryLens.tsx
    - src/ui/tokens.css
    - tests/app.test.tsx
  depends_on: ["task-12"]
  agent: true
  test: "npx vitest run tests/app.test.tsx"
  done_when: "npx vitest run tests/app.test.tsx | grep -q 'Tests.*passed'"
  notes: |
    Audit findings: the lens is pointer-events:none by design so it can't hold
    its own hover, it only lists the first 5 transactions with a pager, and a
    `.scrim`/`.lens` pointer-interception bug blocked scripted clicks (Playwright
    TimeoutError). Improvements:
    1. Make the lens richer: show the category's group, yourShare vs cashOut,
       a mini proportion bar, count, and top merchants — not just a raw tx list.
    2. Make it sticky relative to the hovered row (clamp to viewport) and keep
       pointer-events:none so it never swallows the mouse-out that closes it —
       but add a real click-to-pin mode (click the row -> pinned, interactive
       lens with scroll + full list; Escape or click-away unpins).
    3. Accept keyboard focus: focus the row -> lens opens; tab to it and arrow
       through the tx list. Make the lens itself part of the tab order only when
       pinned (so it doesn't trap focus).
    4. Fix the pointer-interception bug at the source so Playwright/screenshot
       automation and real users can click through after a lens is open.
    5. Mobile: the lens currently hides under 720px — implement a bottom-sheet
       fallback instead of hiding (see task-13 treemap which carries the info).

